name: Respostas do Telegram

# Lê meus ✓/✗ e grava no banco (docs/arquitetura.md seção 8). Depois, retoma o
# agente semanal se a semana está pausada e já é a hora (seção 6).
# O Telegram guarda as atualizações por até 24h; a cada 2h sobra folga mesmo
# com o atraso do cron do Actions.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Duas leituras ao mesmo tempo pegariam as mesmas atualizações. Não perderiam
# nada (gravar é "insere se não existe"), mas confirmariam no celular duas vezes.
concurrency:
  group: replies
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  respostas:
    # Chave liga/desliga: o agendamento só roda depois de `gh variable set
    # PROSPECTOR_ENABLED --body true` (docs/arquitetura.md seção 10). O botão
    # "Run workflow" funciona sempre, para testar com a chave desligada.
    if: github.event_name == 'workflow_dispatch' || vars.PROSPECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Instala o uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instala as dependências
        run: uv sync --no-dev

      - name: Aplica migrações pendentes
        run: uv run prospector db migrate

      - name: Ingere as respostas
        run: uv run prospector ingest-replies --summary

  # Retoma o agente semanal se a auditoria foi respondida ou o prazo venceu
  # (docs/arquitetura.md seção 6). Quase sempre não há semana pausada, e o
  # comando sai em segundos sem chamar LLM nenhum.
  semanal:
    needs: respostas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mesmo grupo do weekly.yml: nunca começar e retomar ao mesmo tempo.
    concurrency:
      group: weekly
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Instala o uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instala as dependências
        run: uv sync --no-dev

      - name: Retoma a semana, se for a hora
        run: uv run prospector weekly resume --summary
