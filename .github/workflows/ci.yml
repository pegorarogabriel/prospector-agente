name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest

    # Postgres descartável só para os testes de contrato e de migração.
    # Nunca aponte TEST_DATABASE_URL para o banco de produção aqui.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Instala o uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instala as dependências
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Testes
        run: uv run pytest
