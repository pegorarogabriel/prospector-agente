[project]
name = "prospector"
version = "0.1.0"
description = "Agente que procura oportunidades de agregamento de caminhão e frete em posts públicos do Facebook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
prospector = "prospector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospector"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle (warnings)
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations — "type hints em tudo" (CLAUDE.md)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Testes não precisam de anotação de tipo em todo lugar.
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
